[project]
name = "hw"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Mikihisa Yuasa", email = "mik0915yua@outlook.com" }]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "pot>=0.9.6.post1",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.2",
    "torch>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["hw"]
